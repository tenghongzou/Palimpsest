name: Flutter CI

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'shared/**'
      - '.github/workflows/flutter.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'shared/**'
      - '.github/workflows/flutter.yml'

defaults:
  run:
    working-directory: mobile

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Check the generated SQLite schema is current
        run: dart run tool/sync_sqlite_schema.dart && git diff --exit-code lib/core/database/sqlite_migrations.g.dart

      - name: Run unit and widget tests
        run: flutter test

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Build release APK
        # Signed with the debug key unless android/key.properties is provided.
        run: flutter build apk --release --dart-define=API_BASE_URL=https://api.palimpsest.cc/api/v1

      - uses: actions/upload-artifact@v4
        with:
          name: palimpsest-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Build release
        # SQLite (sqlite3.dll) is bundled by package:sqlite3's build hook.
        run: flutter build windows --release --dart-define=API_BASE_URL=https://api.palimpsest.cc/api/v1

      - uses: actions/upload-artifact@v4
        with:
          name: palimpsest-windows
          path: mobile/build/windows/x64/runner/Release/
          retention-days: 14

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Build release
        # SQLite is bundled by package:sqlite3's build hook (no libsqlite3-dev).
        run: flutter build linux --release --dart-define=API_BASE_URL=https://api.palimpsest.cc/api/v1

      - uses: actions/upload-artifact@v4
        with:
          name: palimpsest-linux
          path: mobile/build/linux/x64/release/bundle/
          retention-days: 14
