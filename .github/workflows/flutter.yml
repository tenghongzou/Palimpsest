name: Flutter CI

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'shared/**'
      - '.github/workflows/flutter.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'shared/**'
      - '.github/workflows/flutter.yml'

defaults:
  run:
    working-directory: mobile

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Check the generated SQLite schema is current
        run: dart run tool/sync_sqlite_schema.dart && git diff --exit-code lib/core/database/sqlite_migrations.g.dart

      - name: Run unit and widget tests
        run: flutter test

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Build release APK
        # Signed with the debug key unless android/key.properties is provided.
        run: flutter build apk --release --dart-define=API_BASE_URL=https://api.palimpsest.cc/api/v1

      - uses: actions/upload-artifact@v4
        with:
          name: palimpsest-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
