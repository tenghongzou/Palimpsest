name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

defaults:
  run:
    working-directory: backend

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      GONOSUMCHECK: '*'
      GONOSUMDB: '*'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Resolve dependencies
        run: go mod tidy

      - name: Build server
        run: go build -v ./cmd/server

      - name: Run unit tests
        run: go test -v -count=1 ./internal/config/... ./internal/model/... ./internal/pkg/jwt/...
