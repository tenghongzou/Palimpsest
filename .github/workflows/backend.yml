name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

defaults:
  run:
    working-directory: backend

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      GONOSUMCHECK: '*'
      GONOSUMDB: '*'
      # Integration tests use this database; each test runs in its own schema.
      TEST_DATABASE_URL: postgres://palimpsest:palimpsest@localhost:5432/palimpsest_test?sslmode=disable
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: palimpsest
          POSTGRES_PASSWORD: palimpsest
          POSTGRES_DB: palimpsest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U palimpsest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Resolve dependencies
        run: go mod tidy

      - name: Build server
        run: go build -v ./cmd/server

      - name: Vet
        run: go vet ./...

      - name: Run unit and integration tests
        run: go test -count=1 ./...
