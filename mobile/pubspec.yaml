name: palimpsest
description: Cross-platform Chinese novel reading application.
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Network
  dio: ^5.4.3
  connectivity_plus: ^6.0.3

  # Local storage
  sqflite: ^2.3.3
  # Windows and Linux (sqflite has no plugin there). Its sqlite3 dependency
  # bundles SQLite through build hooks, so no system library is needed.
  sqflite_common_ffi: ^2.3.3
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  path: ^1.9.0

  # UI
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Utilities
  json_annotation: ^4.9.0
  intl: '>=0.20.2 <0.21.0'
  logger: ^2.2.0
  image_picker: 1.2.3
  wakelock_plus: 1.8.0
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  # Generates lib/l10n/app_localizations*.dart from the ARB files (l10n.yaml).
  generate: true
  assets:
    - assets/
    - assets/brand/

# App icon generation: `dart run flutter_launcher_icons`
# NOTE: v0.14.4 also rewrites ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS
# in ios/Runner.xcodeproj/project.pbxproj to "AppIcon" — revert that file after running.
# Sources live in assets/icon/ (not bundled: the `assets/` entry above is non-recursive).
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#1890FF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/app_icon_monochrome.png"
  # Foreground PNGs are already padded to the 66/108 safe zone; no extra inset.
  adaptive_icon_foreground_inset: 0
  ios: true
  remove_alpha_ios: true

# Native launch screen: `dart run flutter_native_splash:create`
# Sources live in assets/splash/ (not bundled), made by tool/gen_splash.py
# from shared/brand: the
# mark from png/logo-mark-1024.png, the branding from wordmark.svg in the
# light (#1F2937) and dark (#F5F0E0) wordmark colours. The Android 12 icon is
# the mark at 560/1152 px so it stays inside the 768 px circle mask.
# NOTE: v2.4.8 also re-indents ios/Runner/Info.plist and adds UIStatusBarHidden
# (false, the default) — revert that file after running.
flutter_native_splash:
  color: "#F5F0E0"
  color_dark: "#18181C"
  image: assets/splash/splash_icon.png
  branding: assets/splash/branding.png
  branding_dark: assets/splash/branding_dark.png
  branding_bottom_padding: 24
  android_12:
    color: "#F5F0E0"
    color_dark: "#18181C"
    image: assets/splash/splash_icon_android12.png
    branding: assets/splash/branding.png
    branding_dark: assets/splash/branding_dark.png
  web: false
