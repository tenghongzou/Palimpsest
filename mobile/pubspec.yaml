name: palimpsest
description: Cross-platform Chinese novel reading application.
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Network
  dio: ^5.4.3
  connectivity_plus: ^6.0.3

  # Local storage
  sqflite: ^2.3.3
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3

  # UI
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Utilities
  json_annotation: ^4.9.0
  intl: '>=0.20.2 <0.21.0'
  logger: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/
