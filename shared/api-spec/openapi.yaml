openapi: 3.0.3
info:
  title: Palimpsest API
  description: |
    REST API for the Palimpsest novel reading platform.

    Every response is wrapped in an envelope: `{ "code": 0, "message": "success", "data": ... }`.
    `code` is 0 on success; otherwise it is one of the error codes listed under `ErrorResponse`.

    Authenticated endpoints answer 403 with code 40303 once the account has been
    banned, even while the caller's access token has not expired yet.
  version: 0.4.0
  contact:
    name: Palimpsest Team

servers:
  - url: http://localhost:8080/api/v1
    description: Local development
  - url: https://api.palimpsest.cc/api/v1
    description: Production

tags:
  - name: auth
    description: Authentication
  - name: novels
    description: Novel browsing
  - name: chapters
    description: Chapter content
  - name: categories
    description: Categories
  - name: search
    description: Search
  - name: rankings
    description: Novel rankings
  - name: bookshelf
    description: User bookshelf and reading progress
  - name: translation
    description: Chinese conversion (OpenCC) and machine translation
  - name: users
    description: The current user's profile, settings and statistics
  - name: bookmarks
    description: Bookmarks, synced across devices
  - name: community
    description: Reviews, chapter comments, likes and reports
  - name: notifications
    description: In-app notifications and the user's signed-in devices
  - name: home
    description: Bookstore front page
  - name: admin
    description: Admin management (admin role required)

paths:
  # ---------------------------------------------------------------- auth
  /auth/register:
    post:
      tags: [auth]
      operationId: register
      security: []
      summary: Register a new user
      description: Rate limited to 5 requests/minute per IP (login, password reset and registration each have their own quota).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResultResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      summary: Login with username or email and password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResultResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      security: []
      summary: Exchange a refresh token for a new token pair
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResultResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      security: []
      summary: Logout (client discards its tokens)
      responses:
        '200': { $ref: '#/components/responses/Empty' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/forgot-password:
    post:
      tags: [auth]
      operationId: forgotPassword
      security: []
      summary: Request a password reset email
      description: Always succeeds to prevent email enumeration.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPasswordRequest' }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/reset-password:
    post:
      tags: [auth]
      operationId: resetPassword
      security: []
      summary: Reset password with a reset token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # -------------------------------------------------------------- novels
  /novels:
    get:
      tags: [novels]
      operationId: listNovels
      security: []
      summary: List published novels with filtering and pagination
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: category_id
          in: query
          schema: { type: integer }
        - name: category
          in: query
          description: Category slug; ignored when category_id is given
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/NovelStatus' }
        - name: language
          in: query
          schema: { $ref: '#/components/schemas/Language' }
        - name: sort_by
          in: query
          schema: { type: string, enum: [latest, popular, rating, words, favorites, new], default: latest }
      responses:
        '200':
          description: Paginated novel list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NovelPageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /novels/{novelId}:
    get:
      tags: [novels]
      operationId: getNovel
      security: []
      summary: Get novel details
      parameters:
        - $ref: '#/components/parameters/NovelId'
      responses:
        '200':
          description: Novel details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NovelResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /novels/{novelId}/chapters:
    get:
      tags: [chapters]
      operationId: listChapters
      security: []
      summary: List published chapters of a novel (table of contents, no content)
      parameters:
        - $ref: '#/components/parameters/NovelId'
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
      responses:
        '200':
          description: Chapter list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChapterListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /novels/{novelId}/chapters/{chapterId}:
    get:
      tags: [chapters]
      operationId: getChapter
      security: []
      summary: Get a published chapter with links to its neighbours
      description: Counts a view of the novel unless count_view=false.
      parameters:
        - $ref: '#/components/parameters/NovelId'
        - $ref: '#/components/parameters/ChapterId'
        - name: count_view
          in: query
          description: Send false for bulk offline downloads so they are not counted as views
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: Chapter with content
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChapterDetailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /chapters/{chapterId}:
    get:
      tags: [chapters]
      operationId: getChapterById
      security: []
      summary: Get a published chapter by id alone (used by readers that route by chapter)
      description: Counts a view of the novel unless count_view=false.
      parameters:
        - $ref: '#/components/parameters/ChapterId'
        - name: count_view
          in: query
          description: Send false for bulk offline downloads so they are not counted as views
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: Chapter with content
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChapterDetailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /novels/{novelId}/reviews:
    get:
      tags: [community]
      operationId: listReviews
      summary: List approved reviews of a novel
      description: With a bearer token, `liked_by_me` marks reviews the caller liked.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/NovelId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: sort_by
          in: query
          schema: { type: string, enum: [latest, popular], default: latest }
      responses:
        '200':
          description: Paginated reviews
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, pagination]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Review' }
                          pagination: { $ref: '#/components/schemas/Pagination' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [community]
      operationId: createReview
      summary: Review a novel (once per user)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/NovelId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Review' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /chapters/{chapterId}/comments:
    get:
      tags: [community]
      operationId: listComments
      summary: List a chapter's top-level comments with their replies
      description: With a bearer token, `liked_by_me` marks comments the caller liked.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ChapterId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: sort_by
          in: query
          schema: { type: string, enum: [latest, popular], default: latest }
        - name: paragraph_index
          in: query
          description: Only comments on this paragraph
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Paginated comments
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, pagination]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Comment' }
                          pagination: { $ref: '#/components/schemas/Pagination' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [community]
      operationId: createComment
      summary: Comment on a chapter, or reply to a comment
      description: Replies always attach to the top-level comment of the thread.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ChapterId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Comment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /chapters/{chapterId}/comments/paragraph-counts:
    get:
      tags: [community]
      operationId: paragraphCommentCounts
      summary: How many top-level comments each paragraph of a chapter has
      description: Only paragraphs with comments are listed, in paragraph order. Replies are not counted.
      parameters:
        - $ref: '#/components/parameters/ChapterId'
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ParagraphCount' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /reviews/{reviewId}:
    put:
      tags: [community]
      operationId: updateReview
      summary: Update your review
      security: [{ bearerAuth: [] }]
      parameters:
        - name: reviewId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Review' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [community]
      operationId: deleteReview
      summary: Delete your review (admins may delete any)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: reviewId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/Empty' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /reviews/{reviewId}/like:
    post:
      tags: [community]
      operationId: likeReview
      summary: Like a review (idempotent)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: reviewId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Like state
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LikeResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [community]
      operationId: unlikeReview
      summary: Remove your like (idempotent)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: reviewId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Like state
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LikeResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /comments/{commentId}:
    get:
      tags: [community]
      operationId: getCommentThread
      summary: The thread containing a comment
      description: |
        Returns the thread's top-level comment with its replies, whether the id
        is the top-level comment or one of the replies (e.g. `comment_id` of a
        `comment_reply` notification). With a bearer token, `liked_by_me`
        marks comments the caller liked.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - name: commentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Thread
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Comment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [community]
      operationId: deleteComment
      summary: Delete your comment and its replies (admins may delete any)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: commentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/Empty' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /comments/{commentId}/like:
    post:
      tags: [community]
      operationId: likeComment
      summary: Like a comment (idempotent)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: commentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Like state
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LikeResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [community]
      operationId: unlikeComment
      summary: Remove your like (idempotent)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: commentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Like state
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LikeResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /reports:
    post:
      tags: [community]
      operationId: createReport
      summary: Report content to moderators
      description: Reporting the same target again while a report is pending returns that report.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportInput' }
      responses:
        '201':
          description: Report
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Report' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /home:
    get:
      tags: [home]
      operationId: getHome
      security: []
      summary: Bookstore front page sections (cached for 5 minutes)
      responses:
        '200':
          description: Front page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/HomePage' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /banners:
    get:
      tags: [home]
      operationId: listBanners
      security: []
      summary: Active banners within their schedule
      responses:
        '200':
          description: Banners
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Banner' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /categories:
    get:
      tags: [categories]
      operationId: listCategories
      security: []
      summary: List categories (tree)
      responses:
        '200':
          description: Category list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/BadRequest' }

  # -------------------------------------------------------------- search
  /search/novels:
    get:
      tags: [search]
      operationId: searchNovels
      security: []
      summary: Full-text search novels (Meilisearch)
      description: Rate limited to 30 requests/minute per user (or per IP when anonymous).
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/NovelStatus' }
        - name: language
          in: query
          schema: { $ref: '#/components/schemas/Language' }
      responses:
        '200':
          description: Search result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SearchResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /search/suggestions:
    get:
      tags: [search]
      operationId: searchSuggestions
      security: []
      summary: Title suggestions for a partial query (max 5)
      parameters:
        - name: q
          in: query
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/StringList' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /search/hot-keywords:
    get:
      tags: [search]
      operationId: hotKeywords
      security: []
      summary: Top 10 most searched keywords
      responses:
        '200': { $ref: '#/components/responses/StringList' }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ------------------------------------------------------------ rankings
  /rankings/{type}:
    get:
      tags: [rankings]
      operationId: getRanking
      security: []
      summary: Get novel rankings
      parameters:
        - name: type
          in: path
          required: true
          schema: { type: string, enum: [views, favorites, rating, latest, completed] }
        - name: period
          in: query
          description: Only the views board is computed per period; the other boards ignore it.
          schema: { type: string, enum: [daily, weekly, monthly, all], default: weekly }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated ranking
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NovelPageResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ----------------------------------------------------------- bookshelf
  /bookshelf:
    get:
      tags: [bookshelf]
      operationId: listBookshelf
      summary: Get the current user's bookshelf
      security: [{ bearerAuth: [] }]
      parameters:
        - name: sort_by
          in: query
          schema: { type: string, enum: [recent, added, title], default: recent }
      responses:
        '200':
          description: Bookshelf items
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/BookshelfEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [bookshelf]
      operationId: addToBookshelf
      summary: Add a novel to the bookshelf
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddBookshelfRequest' }
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/BookshelfItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /bookshelf/batch-remove:
