                      data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [users]
      operationId: updateMe
      summary: Update profile fields; omitted fields stay unchanged
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdate' }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/me/avatar:
    post:
      tags: [users]
      operationId: uploadAvatar
      summary: Upload an avatar (JPEG, PNG, WebP or GIF, at most 2 MB)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar: { type: string, format: binary }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/BadRequest' }
        '415': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /users/me/password:
    put:
      tags: [users]
      operationId: changePassword
      summary: Change password
      description: Revokes refresh tokens and reset links issued before the change.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200': { $ref: '#/components/responses/Empty' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/me/reading-stats:
    get:
      tags: [users]
      operationId: readingStats
      summary: Reading totals and per-period activity
      security: [{ bearerAuth: [] }]
      parameters:
        - name: period
          in: query
          description: daily = last 7 days, weekly = last 8 weeks, monthly = last 12 months
          schema: { type: string, enum: [daily, weekly, monthly], default: daily }
        - name: utc_offset
          in: query
          description: |
            The client's UTC offset in minutes east of UTC (480 for UTC+8).
            Buckets follow the client's local days, and each `start` is the
            instant that local day, week or month began. Defaults to UTC.
          schema: { type: integer, minimum: -840, maximum: 840, default: 0 }
      responses:
        '200':
          description: Stats
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ReadingStats' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/me/reading-settings:
    get:
      tags: [users]
      operationId: getReadingSettings
      summary: Reader preferences (defaults when never saved)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ReadingSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [users]
      operationId: putReadingSettings
      summary: Replace reader preferences
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReadingSettings' }
      responses:
        '200':
          description: Saved settings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ReadingSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/me/devices:
    get:
      tags: [notifications]
      operationId: listDevices
      summary: The user's signed-in devices, most recently active first
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Devices
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Device' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [notifications]
      operationId: registerDevice
      summary: Register this installation, or refresh it when already registered
      description: |
        Clients call this after signing in and when their push token changes.
        `device_id` is a stable id the client generates once per installation.
        A push token moves to the account that registered it last. Each user
        keeps at most 20 devices; the least recently active ones are dropped.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceInput' }
      responses:
        '200':
          description: The registered device
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Device' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/me/devices/{deviceId}:
    delete:
      tags: [notifications]
      operationId: removeDevice
      summary: Remove a device (e.g. on sign-out)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: deviceId
          in: path
          required: true
          description: The device's `id` (not its `device_id`)
          schema: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/Empty' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------- notifications
  /notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: The user's notifications, newest first
      description: |
        Types: `chapter_update` (a novel on the bookshelf with notifications on
        published chapters; `chapter_id` is the first one the reader has not
        been told about, and later updates fold into an unread notification),
        `comment_reply` (someone replied; `comment_id` is the thread's
        top-level comment) and `system` (announcements).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: unread_only
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Paginated notifications
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, pagination]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Notification' }
                          pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications/unread-count:
    get:
      tags: [notifications]
      operationId: unreadNotificationCount
      summary: Number of unread notifications
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Count
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [count]
                        properties:
                          count: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications/read-all:
    put:
      tags: [notifications]
      operationId: markAllNotificationsRead
      summary: Mark every notification read
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: How many were unread
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [updated]
                        properties:
                          updated: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications/{notificationId}/read:
    put:
      tags: [notifications]
      operationId: markNotificationRead
      summary: Mark a notification read
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200': { $ref: '#/components/responses/Empty' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /notifications/{notificationId}:
    delete:
