      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/NovelId'
      responses:
        '200': { $ref: '#/components/responses/Empty' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/novels/{novelId}/publish:
    post:
      tags: [admin]
      operationId: adminPublishNovel
      summary: "Publish a novel, or unpublish it with `{\"is_published\": false}`"
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/NovelId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                is_published: { type: boolean, default: true }
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NovelResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/novels/{novelId}/chapters:
    get:
      tags: [admin]
      operationId: adminListChapters
      summary: All chapters of a novel, published or not (no content)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/NovelId'
      responses:
        '200':
          description: Chapters
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChapterListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin]
      operationId: adminCreateChapter
      summary: Create a chapter
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/NovelId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChapterInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChapterResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/novels/{novelId}/chapters/batch:
    post:
      tags: [admin]
      operationId: adminBatchImportChapters
      summary: Batch import up to 500 chapters
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/NovelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/ChapterInput' }
      responses:
        '201':
          description: Imported
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          imported: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }

  /admin/chapters/{chapterId}:
    get:
      tags: [admin]
      operationId: adminGetChapter
      summary: Get any chapter with content
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ChapterId'
      responses:
        '200':
          description: Chapter
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChapterResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [admin]
      operationId: adminUpdateChapter
      summary: Update a chapter
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ChapterId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChapterInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChapterResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [admin]
      operationId: adminDeleteChapter
      summary: Delete a chapter
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ChapterId'
      responses:
        '200': { $ref: '#/components/responses/Empty' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/users:
    get:
      tags: [admin]
      operationId: adminListUsers
      summary: List users
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: q
          in: query
          description: Matches username, email or nickname
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [active, banned] }
      responses:
        '200':
          description: Paginated users
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/User' }
                          pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/users/{userId}:
    get:
      tags: [admin]
      operationId: adminGetUser
      summary: Get a user
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/users/{userId}/status:
    put:
      tags: [admin]
      operationId: adminUpdateUserStatus
      summary: Ban or unban a user
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, banned] }
      responses:
        '200':
          description: New status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/reviews:
    get:
      tags: [admin]
      operationId: adminListReviews
      summary: List reviews for moderation
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ModerationStatus' }
      responses:
        '200':
          description: Paginated reviews
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, pagination]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Review' }
                          pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/reviews/{reviewId}:
    put:
      tags: [admin]
      operationId: adminModerateReview
      summary: Approve, reject or hide a review (updates the novel's rating)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: reviewId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/ModerationStatus' }
      responses:
        '200':
          description: Moderated review
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Review' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/reports:
    get:
      tags: [admin]
      operationId: adminListReports
      summary: List reports with a preview of the reported content
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema: { type: string, enum: [pending, resolved, dismissed] }
      responses:
        '200':
          description: Paginated reports
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, pagination]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/ReportView' }
                          pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/reports/{reportId}:
    put:
      tags: [admin]
      operationId: adminResolveReport
      summary: Resolve or dismiss a report, optionally hiding the reported review or comment
      security: [{ bearerAuth: [] }]
      parameters:
        - name: reportId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [resolved, dismissed] }
                hide_target: { type: boolean, default: false }
      responses:
        '200':
          description: Closed report
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Report' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/categories:
    get:
      tags: [admin]
      operationId: adminListCategories
      summary: All categories, flat, including inactive ones
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Category' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin]
      operationId: adminCreateCategory
      summary: Create a category (two levels at most)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/categories/{categoryId}:
    put:
      tags: [admin]
      operationId: adminUpdateCategory
      summary: Update a category
      security: [{ bearerAuth: [] }]
      parameters:
        - name: categoryId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [admin]
      operationId: adminDeleteCategory
      summary: Delete a category without subcategories
      description: Answers 409 with code 40905 while subcategories exist; a duplicate slug on create or update is 40903.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: categoryId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { $ref: '#/components/responses/Empty' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/banners:
    get:
      tags: [admin]
      operationId: adminListBanners
      summary: All banners
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Banners
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Banner' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin]
      operationId: adminCreateBanner
      summary: Create a banner
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BannerInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Banner' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /admin/banners/{bannerId}:
    put:
      tags: [admin]
      operationId: adminUpdateBanner
      summary: Update a banner
      security: [{ bearerAuth: [] }]
      parameters:
        - name: bannerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BannerInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Banner' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [admin]
      operationId: adminDeleteBanner
      summary: Delete a banner
      security: [{ bearerAuth: [] }]
      parameters:
        - name: bannerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/Empty' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/uploads:
    post:
      tags: [admin]
      operationId: adminUploadImage
      summary: Upload a cover or banner image (at most 5 MB) and get its URL
      security: [{ bearerAuth: [] }]
      parameters:
        - name: kind
          in: query
          schema: { type: string, enum: [covers, banners], default: covers }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          url: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /admin/notifications/broadcast:
    post:
      tags: [admin]
      operationId: adminBroadcastNotification
      summary: Send a system notification to every active user
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, maxLength: 200 }
                body: { type: string, maxLength: 2000 }
      responses:
        '201':
          description: Sent
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [recipients]
                        properties:
                          recipients: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/stats:
    get:
      tags: [admin]
      operationId: adminStats
      summary: Dashboard overview counts
      security: [{ bearerAuth: [] }]
      parameters:
        - name: utc_offset
          in: query
          description: |
            The client's UTC offset in minutes east of UTC (480 for UTC+8).
            The `*_today` counts start at the client's local midnight. Defaults to UTC.
          schema: { type: integer, minimum: -840, maximum: 840, default: 0 }
      responses:
        '200':
          description: Stats
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminStats' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, default: 1, minimum: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
    NovelId:
      name: novelId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ChapterId:
      name: chapterId
      in: path
      required: true
      schema: { type: string, format: uuid }
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Empty:
      description: Success with no data
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    Message:
      description: Success with a message
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      message: { type: string }
    StringList:
      description: List of strings
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: array
                    items: { type: string }
    BadRequest:
      description: Validation error (40001-40099)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Authentication error (40101-40199)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Authorization error (40301-40399)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Not found (40401-40499)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Conflict (40901-40999)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TooManyRequests:
      description: Rate limit exceeded (42901-42999)
      headers:
        X-RateLimit-Limit:
          schema: { type: integer }
        X-RateLimit-Remaining:
          schema: { type: integer }
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ServiceUnavailable:
      description: |
        A dependency is not configured or failing: translation provider
        (50301, 50302) or file storage (50303)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    # ------------------------------------------------------------ envelope
    Envelope:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          description: 0 = success
        message:
          type: string

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, example: 40001 }
        message: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    Pagination:
      type: object
      required: [page, page_size, total, total_pages]
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }

    Language:
      type: string
      enum: [zh-TW, zh-CN, en]

    NovelStatus:
      type: string
      enum: [ongoing, completed, hiatus]

    # ---------------------------------------------------------------- auth
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 50 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 72 }
        nickname: { type: string, maxLength: 50 }

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          description: Username or email
        password: { type: string }

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    ResetPasswordRequest:
      type: object
      required: [token, new_password]
      properties:
        token: { type: string }
        new_password: { type: string, minLength: 8, maxLength: 72 }

    AuthResult:
      type: object
      required: [user, access_token, refresh_token, expires_in]
      properties:
        user: { $ref: '#/components/schemas/User' }
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in:
          type: integer
          description: Access token lifetime in seconds

    AuthResultResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/AuthResult' }

    User:
      type: object
      required: [id, username, nickname, role, status, language_pref]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string }
        phone: { type: string }
        nickname: { type: string }
        avatar_url: { type: string }
        bio: { type: string }
        role: { type: string, enum: [reader, author, admin, super_admin] }
        status: { type: string, enum: [active, banned] }
        language_pref: { $ref: '#/components/schemas/Language' }
        total_read_words: { type: integer, format: int64 }
        total_read_seconds: { type: integer, format: int64 }
        last_login_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # -------------------------------------------------------------- novels
    Novel:
      type: object
      required: [id, title, author_name, status, language]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        author_name: { type: string }
        author_id: { type: string, format: uuid }
        cover_url: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/NovelStatus' }
        language: { $ref: '#/components/schemas/Language' }
        total_words: { type: integer, format: int64 }
        total_chapters: { type: integer }
        view_count: { type: integer, format: int64 }
        favorite_count: { type: integer }
        review_count: { type: integer }
        avg_rating: { type: number }
        is_published: { type: boolean }
        is_featured: { type: boolean }
        latest_chapter_id: { type: string, format: uuid }
        latest_chapter_title: { type: string }
        latest_chapter_at: { type: string, format: date-time }
        published_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        categories:
          type: array
          items: { $ref: '#/components/schemas/Category' }
        tags:
          type: array
          items: { $ref: '#/components/schemas/Tag' }

    NovelInput:
      type: object
      required: [title, author_name]
      properties:
        title: { type: string, maxLength: 200 }
        author_name: { type: string, maxLength: 100 }
        cover_url: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/NovelStatus' }
        language: { $ref: '#/components/schemas/Language' }
        is_featured: { type: boolean }
        category_ids:
          type: array
          description: Replaces the novel's categories when present
          items: { type: integer }
        tags:
          type: array
          description: Replaces the novel's tags when present; unknown tags are created
          items: { type: string, maxLength: 30 }

    NovelResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Novel' }

    NovelPageResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [items, pagination]
              properties:
                items:
                  type: array
                  items: { $ref: '#/components/schemas/Novel' }
                pagination: { $ref: '#/components/schemas/Pagination' }

    Category:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: integer }
        parent_id: { type: integer }
        name: { type: string }
        slug: { type: string }
        icon_url: { type: string }
        sort_order: { type: integer }
        is_active: { type: boolean }
        children:
          type: array
          items: { $ref: '#/components/schemas/Category' }

    Tag:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        usage_count: { type: integer }

    # ------------------------------------------------------------ chapters
    Chapter:
      type: object
      required: [id, novel_id, title, chapter_number]
      properties:
        id: { type: string, format: uuid }
        novel_id: { type: string, format: uuid }
        volume_id: { type: string, format: uuid }
        title: { type: string }
        content:
          type: string
          description: Omitted in chapter lists
        chapter_number: { type: integer }
        word_count: { type: integer }
        is_published: { type: boolean }
        is_free: { type: boolean }
        published_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ChapterInput:
      type: object
      required: [title, content, chapter_number]
      properties:
        novel_id: { type: string, format: uuid }
        volume_id: { type: string, format: uuid }
        title: { type: string, maxLength: 200 }
        content: { type: string }
        chapter_number: { type: integer }
        word_count: { type: integer }
        is_published: { type: boolean }
        is_free: { type: boolean }

    ChapterResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Chapter' }

    ChapterRef:
      type: object
      required: [id, title, chapter_number]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        chapter_number: { type: integer }

    ChapterDetail:
      allOf:
        - $ref: '#/components/schemas/Chapter'
        - type: object
          required: [prev_chapter, next_chapter]
          properties:
            prev_chapter:
              type: object
              nullable: true
              allOf: [{ $ref: '#/components/schemas/ChapterRef' }]
            next_chapter:
              type: object
              nullable: true
              allOf: [{ $ref: '#/components/schemas/ChapterRef' }]

    ChapterDetailResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ChapterDetail' }

    ChapterListResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Chapter' }

    # -------------------------------------------------------------- search
    SearchResult:
      type: object
      required: [hits, query]
      properties:
        hits:
          type: array
          description: Meilisearch documents (subset of Novel fields)
          items:
            type: object
            additionalProperties: true
        query: { type: string }
        processing_time_ms: { type: integer }
        estimated_total: { type: integer }

    # ----------------------------------------------------------- bookshelf
    BookshelfItem:
      type: object
      required: [id, user_id, novel_id]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        novel_id: { type: string, format: uuid }
        group_name: { type: string }
        sort_order: { type: integer }
        is_notified: { type: boolean }
        added_at: { type: string, format: date-time }
        novel: { $ref: '#/components/schemas/Novel' }

    BookshelfItemUpdate:
      type: object
      properties:
        group_name: { type: string, minLength: 1, maxLength: 50 }
        is_notified:
          type: boolean
          description: Whether newly published chapters send a notification

    BookshelfEntry:
      allOf:
        - $ref: '#/components/schemas/BookshelfItem'
        - type: object
          required: [reading_progress, has_update]
          properties:
            reading_progress:
              type: object
              nullable: true
              properties:
                chapter_id: { type: string, format: uuid }
                chapter_title: { type: string }
                chapter_number: { type: integer }
                percentage: { type: number, minimum: 0, maximum: 100 }
                read_at: { type: string, format: date-time }
            has_update:
              type: boolean
              description: Chapters were published after the reader last read

    NovelIdsRequest:
      type: object
      required: [novel_ids]
      properties:
        novel_ids:
          type: array
          maxItems: 200
          items: { type: string, format: uuid }

    AddBookshelfRequest:
      type: object
      required: [novel_id]
      properties:
        novel_id: { type: string, format: uuid }
        group_name: { type: string, default: default }

    ReadingProgress:
      type: object
      required: [novel_id, chapter_id]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        novel_id: { type: string, format: uuid }
        chapter_id: { type: string, format: uuid }
        paragraph_index: { type: integer }
        scroll_offset: { type: number, minimum: 0, maximum: 1 }
        read_duration: { type: integer }
        read_at: { type: string, format: date-time }
        synced_at: { type: string, format: date-time }

    ReadingProgressResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/ReadingProgress' }

    UpdateProgressRequest:
      type: object
      required: [chapter_id]
      properties:
        chapter_id: { type: string, format: uuid }
        paragraph_index: { type: integer, minimum: 0 }
        scroll_offset: { type: number, minimum: 0, maximum: 1 }
        read_at:
          type: string
          format: date-time
          description: When the position was read; defaults to now
        duration:
          type: integer
          minimum: 0
          description: Seconds read since the previous report (at most 3600 count)

    ReadingHistory:
      type: object
      required: [id, novel_id, chapter_id, read_at]
      properties:
        id: { type: string, format: uuid }
        novel_id: { type: string, format: uuid }
        chapter_id: { type: string, format: uuid }
        read_at: { type: string, format: date-time }
        duration: { type: integer }
        novel: { $ref: '#/components/schemas/Novel' }
        chapter: { $ref: '#/components/schemas/Chapter' }

    # ----------------------------------------------------------- bookmarks
    Bookmark:
      type: object
      required: [id, novel_id, chapter_id, paragraph_index]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        novel_id: { type: string, format: uuid }
        chapter_id: { type: string, format: uuid }
        paragraph_index: { type: integer }
        note: { type: string }
        created_at: { type: string, format: date-time }
        synced_at: { type: string, format: date-time }
        chapter: { $ref: '#/components/schemas/Chapter' }
        novel:
          type: object
          properties:
            id: { type: string, format: uuid }
            title: { type: string }

    BookmarkInput:
      type: object
      required: [chapter_id]
      properties:
        id:
          type: string
          format: uuid
          description: Client-generated id, so offline bookmarks keep their identity
        chapter_id: { type: string, format: uuid }
        paragraph_index: { type: integer, minimum: 0 }
        note: { type: string, maxLength: 500 }
        created_at: { type: string, format: date-time }

    BookmarkPatch:
      type: object
      properties:
        paragraph_index: { type: integer, minimum: 0 }
        note: { type: string, maxLength: 500 }

    BookmarkSync:
      type: object
      properties:
        upserts:
          type: array
          items: { $ref: '#/components/schemas/BookmarkInput' }
        deletes:
          type: array
          items: { type: string, format: uuid }

    # --------------------------------------------------------------- users
    ProfileUpdate:
      type: object
      properties:
        nickname: { type: string, minLength: 1, maxLength: 50 }
        bio: { type: string, maxLength: 500 }
        avatar_url: { type: string, maxLength: 500 }
        language_pref: { $ref: '#/components/schemas/Language' }

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string }
        new_password: { type: string, minLength: 8, maxLength: 72 }

    ReadingSettings:
      type: object
      required: [font_size, line_height, theme, reading_mode, brightness]
      properties:
        font_size: { type: integer, minimum: 12, maximum: 36 }
        line_height: { type: number, minimum: 1.2, maximum: 3 }
        letter_spacing: { type: number, minimum: 0, maximum: 5 }
        margin: { type: integer, minimum: 0, maximum: 64 }
        font_family: { type: string, maxLength: 50 }
        theme: { type: string, enum: [white, sepia, green, dark, black] }
        reading_mode: { type: string, enum: [scroll, page] }
        page_animation:
          type: string
          enum: [none, slide, cover, curl]
          default: slide
          description: How page mode turns pages. Omitting it on save keeps the stored value.
        brightness: { type: integer, minimum: 10, maximum: 100 }
        keep_screen_on: { type: boolean }
        auto_chapter: { type: boolean }
        updated_at: { type: string, format: date-time, readOnly: true }

    ReadingStats:
      type: object
      required: [total_read_words, total_read_seconds, chapters_read, novels_read, period, buckets]
      properties:
        total_read_words: { type: integer, format: int64 }
        total_read_seconds: { type: integer, format: int64 }
        chapters_read: { type: integer }
        novels_read: { type: integer }
        bookshelf_count: { type: integer }
        bookmark_count: { type: integer }
        review_count: { type: integer }
        period: { type: string, enum: [daily, weekly, monthly] }
        buckets:
          type: array
          description: Oldest first; the last bucket is the current day, week or month
          items:
            type: object
            required: [start, chapters, words, seconds]
            properties:
              start: { type: string, format: date-time }
              chapters: { type: integer }
              words: { type: integer }
              seconds: { type: integer }

    UserBrief:
      type: object
      required: [id, username, nickname]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        nickname: { type: string }
        avatar_url: { type: string }

    # --------------------------------------------------------- translation
    ConvertRequest:
      type: object
      required: [text, from, to]
      properties:
        text: { type: string, maxLength: 50000 }
        from: { type: string, enum: [zh-TW, zh-CN] }
        to: { type: string, enum: [zh-TW, zh-CN] }

    TranslateTextRequest:
      type: object
      required: [text, to]
      properties:
        text: { type: string, maxLength: 5000 }
        from:
          type: string
          description: Source language; auto-detected when omitted
          enum: [zh-TW, zh-CN, en]
        to: { $ref: '#/components/schemas/Language' }

    TextTranslation:
      type: object
      required: [text, to]
      properties:
        text: { type: string }
        from: { type: string }
        to: { type: string }

    TextTranslationResponse:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/TextTranslation' }

    TranslateChapterRequest:
      type: object
      required: [chapter_id, target_lang]
      properties:
        chapter_id: { type: string, format: uuid }
        target_lang: { $ref: '#/components/schemas/Language' }

    ChapterTranslation:
      type: object
      required: [chapter_id, original_lang, target_lang, translated_content, is_cached]
      properties:
        chapter_id: { type: string, format: uuid }
        original_lang: { $ref: '#/components/schemas/Language' }
        target_lang: { $ref: '#/components/schemas/Language' }
        translated_title: { type: string }
        translated_content: { type: string }
        is_cached: { type: boolean }

    # ----------------------------------------------------------- community
    ModerationStatus:
      type: string
      enum: [approved, rejected, hidden]

    Review:
      type: object
      required: [id, user_id, novel_id, title, content, rating, like_count, status, liked_by_me]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        novel_id: { type: string, format: uuid }
        title: { type: string }
        content: { type: string }
        rating: { type: number, minimum: 0.5, maximum: 5, multipleOf: 0.5 }
        like_count: { type: integer }
        status: { $ref: '#/components/schemas/ModerationStatus' }
        user: { $ref: '#/components/schemas/UserBrief' }
        novel:
          type: object
          description: Only in admin listings
          properties:
            id: { type: string, format: uuid }
            title: { type: string }
        liked_by_me: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ReviewInput:
      type: object
      required: [title, content, rating]
      properties:
        title: { type: string, maxLength: 200 }
        content: { type: string, maxLength: 10000 }
        rating:
          type: number
          minimum: 0.5
          maximum: 5
          description: Rounded to the nearest half star

    Comment:
      type: object
      required: [id, user_id, chapter_id, content, like_count, liked_by_me]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        chapter_id: { type: string, format: uuid }
        parent_id: { type: string, format: uuid }
        content: { type: string }
        paragraph_index: { type: integer }
        like_count: { type: integer }
        status: { $ref: '#/components/schemas/ModerationStatus' }
        user: { $ref: '#/components/schemas/UserBrief' }
        liked_by_me: { type: boolean }
        replies:
          type: array
          items: { $ref: '#/components/schemas/Comment' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CommentInput:
      type: object
      required: [content]
      properties:
        content: { type: string, maxLength: 2000 }
        parent_id: { type: string, format: uuid }
        paragraph_index: { type: integer, minimum: 0 }

    LikeResult:
      type: object
      required: [liked, like_count]
      properties:
        liked: { type: boolean }
        like_count: { type: integer }

    ReportInput:
      type: object
      required: [target_type, target_id, reason]
      properties:
        target_type: { type: string, enum: [review, comment, novel, chapter, user] }
        target_id: { type: string, format: uuid }
        reason: { type: string, enum: [spam, abuse, spoiler, copyright, inappropriate, other] }
        description: { type: string, maxLength: 1000 }

    Report:
      type: object
      required: [id, reporter_id, target_type, target_id, reason, status]
      properties:
        id: { type: string, format: uuid }
        reporter_id: { type: string, format: uuid }
        target_type: { type: string }
        target_id: { type: string, format: uuid }
        reason: { type: string }
        description: { type: string }
        status: { type: string, enum: [pending, resolved, dismissed] }
        resolved_by: { type: string, format: uuid }
        resolved_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        reporter: { $ref: '#/components/schemas/UserBrief' }

    ReportView:
      allOf:
        - $ref: '#/components/schemas/Report'
        - type: object
          properties:
            target_preview:
              type: string
              description: First 120 characters of the reported content
    # --------------------------------------------------------------- admin
    # ---------------------------------------------------------------- home
    Banner:
      type: object
      required: [id, title, image_url, sort_order, is_active]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        image_url: { type: string }
        link_type: { type: string, enum: [novel, url, category] }
        link_value: { type: string }
        sort_order: { type: integer }
        is_active: { type: boolean }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    BannerInput:
      type: object
      required: [title, image_url]
      properties:
        title: { type: string, maxLength: 200 }
        image_url: { type: string, maxLength: 500 }
        link_type: { type: string, enum: [novel, url, category] }
        link_value:
          type: string
          maxLength: 500
          description: Novel id, absolute URL, or category slug, depending on link_type
        sort_order: { type: integer }
        is_active: { type: boolean, default: true }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }

    HomePage:
      type: object
      required: [banners, featured, latest_updates, popular, new_arrivals, completed]
      properties:
        banners:
          type: array
          items: { $ref: '#/components/schemas/Banner' }
        featured:
          type: array
          items: { $ref: '#/components/schemas/Novel' }
        latest_updates:
          type: array
          items: { $ref: '#/components/schemas/Novel' }
        popular:
          type: array
          items: { $ref: '#/components/schemas/Novel' }
        new_arrivals:
          type: array
          items: { $ref: '#/components/schemas/Novel' }
        completed:
          type: array
          items: { $ref: '#/components/schemas/Novel' }

    # --------------------------------------------------------------- admin
    CategoryInput:
      type: object
      required: [name, slug]
      properties:
        parent_id:
          type: integer
          description: A top-level category; categories are at most two levels deep
        name: { type: string, maxLength: 50 }
        slug: { type: string, maxLength: 50 }
        icon_url: { type: string, maxLength: 500 }
        sort_order: { type: integer }
        is_active: { type: boolean, default: true }

    AdminStats:
      type: object
      required: [users, new_users_today, novels, published_novels, chapters, reviews, comments, pending_reports, active_readers_7d, reads_today]
      properties:
        users: { type: integer }
        new_users_today: { type: integer }
        novels: { type: integer }
        published_novels: { type: integer }
        chapters: { type: integer }
        reviews: { type: integer }
        comments: { type: integer }
        pending_reports: { type: integer }
        active_readers_7d: { type: integer }
        reads_today: { type: integer }

    ParagraphCount:
      type: object
      required: [paragraph_index, count]
      properties:
        paragraph_index: { type: integer, minimum: 0 }
        count: { type: integer, minimum: 1 }

    NotificationType:
      type: string
      enum: [chapter_update, comment_reply, system]

    Notification:
      type: object
      required: [id, type, title, read_at, created_at]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/NotificationType' }
        title: { type: string }
        body: { type: string }
        novel_id: { type: string, format: uuid }
        chapter_id: { type: string, format: uuid }
        comment_id: { type: string, format: uuid }
        read_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        actor: { $ref: '#/components/schemas/UserBrief' }
        params:
          type: object
          additionalProperties: { type: string }
          description: |
            Values for writing the title and body in the client's UI language;
            `title` and `body` hold zh-TW text as a fallback (system
            notifications have no params). chapter_update: `novel`, `chapter`
            (latest chapter title), `chapter_number`. comment_reply: `actor`.

    DeviceType:
      type: string
      enum: [web, android, ios, windows, macos, linux]

    DeviceInput:
      type: object
      required: [device_id, device_type]
      properties:
        device_id: { type: string, maxLength: 255 }
        device_type: { $ref: '#/components/schemas/DeviceType' }
        device_name: { type: string, maxLength: 100 }
        push_token: { type: string, maxLength: 500, description: FCM/APNs token, when the client has one }

    Device:
      type: object
      required: [id, device_id, device_type, last_active_at, created_at]
      properties:
        id: { type: string, format: uuid }
        device_id: { type: string }
        device_type: { $ref: '#/components/schemas/DeviceType' }
        device_name: { type: string }
        last_active_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
