openapi: 3.0.3
info:
  title: Palimpsest API
  description: REST API for Palimpsest novel reading platform
  version: 0.1.0
  contact:
    name: Palimpsest Team

servers:
  - url: http://localhost:8080/api/v1
    description: Local development
  - url: https://api.palimpsest.cc/api/v1
    description: Production

tags:
  - name: auth
    description: Authentication endpoints
  - name: users
    description: User management
  - name: novels
    description: Novel browsing
  - name: chapters
    description: Chapter content
  - name: bookshelf
    description: User bookshelf
  - name: search
    description: Search functionality
  - name: rankings
    description: Novel rankings
  - name: translation
    description: Translation services
  - name: admin
    description: Admin management

paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /auth/login:
    post:
      tags: [auth]
      summary: Login with email/username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /auth/refresh:
    post:
      tags: [auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string

  /novels:
    get:
      tags: [novels]
      summary: List novels with filtering and pagination
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, default: 20, maximum: 50 }
        - name: category_id
          in: query
          schema: { type: integer }
        - name: status
          in: query
          schema: { type: string, enum: [ongoing, completed] }
        - name: language
          in: query
          schema: { type: string, enum: [zh-TW, zh-CN, en] }
        - name: sort_by
          in: query
          schema: { type: string, enum: [latest, popular, rating, words] }
      responses:
        '200':
          description: Paginated novel list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NovelListResponse'

  /novels/{novelId}:
    get:
      tags: [novels]
      summary: Get novel details
      parameters:
        - name: novelId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Novel details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /novels/{novelId}/chapters:
    get:
      tags: [chapters]
      summary: List chapters for a novel
      parameters:
        - name: novelId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }

  /search/novels:
    get:
      tags: [search]
      summary: Search novels
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: sort_by
          in: query
          schema: { type: string, enum: [relevance, latest, popular] }

  /rankings/{type}:
    get:
      tags: [rankings]
      summary: Get novel rankings
      parameters:
        - name: type
          in: path
          required: true
          schema: { type: string, enum: [views, favorites, rating, latest, completed] }
        - name: period
          in: query
          schema: { type: string, enum: [daily, weekly, monthly, all] }

  /bookshelf:
    get:
      tags: [bookshelf]
      summary: Get user bookshelf
      security:
        - bearerAuth: []
    post:
      tags: [bookshelf]
      summary: Add novel to bookshelf
      security:
        - bearerAuth: []

  /translation/convert:
    post:
      tags: [translation]
      summary: Convert between Traditional and Simplified Chinese (OpenCC)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConvertRequest'

  /translation/chapter:
    post:
      tags: [translation]
      summary: Translate a chapter to target language
      security:
        - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          description: "0 = success, non-zero = error"
        message:
          type: string
        data:
          type: object

    RegisterRequest:
      type: object
      required: [username, email, password, nickname]
      properties:
        username: { type: string, minLength: 3, maxLength: 50 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        nickname: { type: string, maxLength: 50 }

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login: { type: string }
        password: { type: string }

    AuthResponse:
      type: object
      properties:
        code: { type: integer }
        data:
          type: object
          properties:
            user: { $ref: '#/components/schemas/User' }
            access_token: { type: string }
            refresh_token: { type: string }
            expires_in: { type: integer }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string }
        nickname: { type: string }
        avatar_url: { type: string }
        role: { type: string, enum: [reader, author, admin, super_admin] }
        language_pref: { type: string }

    Novel:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        author_name: { type: string }
        cover_url: { type: string }
        description: { type: string }
        status: { type: string, enum: [ongoing, completed, hiatus] }
        language: { type: string }
        total_words: { type: integer }
        total_chapters: { type: integer }
        view_count: { type: integer }
        favorite_count: { type: integer }
        avg_rating: { type: number }
        latest_chapter_title: { type: string }
        latest_chapter_at: { type: string, format: date-time }
        categories:
          type: array
          items: { $ref: '#/components/schemas/Category' }
        tags:
          type: array
          items: { $ref: '#/components/schemas/Tag' }

    Category:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }

    Tag:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }

    NovelListResponse:
      type: object
      properties:
        code: { type: integer }
        data:
          type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Novel' }
            pagination: { $ref: '#/components/schemas/Pagination' }

    Pagination:
      type: object
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }

    ConvertRequest:
      type: object
      required: [text, from, to]
      properties:
        text: { type: string }
        from: { type: string, enum: [zh-TW, zh-CN] }
        to: { type: string, enum: [zh-TW, zh-CN] }
