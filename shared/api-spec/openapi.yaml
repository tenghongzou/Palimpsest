      summary: Remove several novels from the bookshelf
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NovelIdsRequest' }
      responses:
        '200': { $ref: '#/components/responses/Empty' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /bookshelf/{novelId}:
    patch:
      tags: [bookshelf]
      operationId: updateBookshelfItem
      summary: Move a shelved novel to another group, or turn its update notifications on or off
      description: Omitted fields stay unchanged.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/NovelId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookshelfItemUpdate' }
      responses:
        '200':
          description: The fields that were sent
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/BookshelfItemUpdate' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [bookshelf]
      operationId: removeFromBookshelf
      summary: Remove a novel from the bookshelf
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/NovelId'
      responses:
        '200': { $ref: '#/components/responses/Empty' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /reading-progress:
    get:
      tags: [bookshelf]
      operationId: listReadingProgress
      summary: List all reading progress of the current user (for sync)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Reading progress, most recent first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ReadingProgress' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /reading-progress/batch:
    post:
      tags: [bookshelf]
      operationId: batchReadingProgress
      summary: Reading progress for several novels
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NovelIdsRequest' }
      responses:
        '200':
          description: Reading progress, most recent first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ReadingProgress' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /reading-history:
    get:
      tags: [bookshelf]
      operationId: readingHistory
      summary: Chapters the user opened, newest first
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated history
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, pagination]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/ReadingHistory' }
                          pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /reading-progress/{novelId}:
    get:
      tags: [bookshelf]
      operationId: getReadingProgress
      summary: Get reading progress for a novel
      description: '`data` is null when the user has not read the novel yet.'
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/NovelId'
      responses:
        '200':
          description: Reading progress, or null
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        nullable: true
                        allOf:
                          - $ref: '#/components/schemas/ReadingProgress'
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [bookshelf]
      operationId: updateReadingProgress
      summary: Update reading progress for a novel
      description: |
        Last read wins: if `read_at` is older than the stored progress, the
        update is ignored and the stored progress is returned. Offline clients
        should send the time the position was actually read. Moving to another
        chapter adds a reading history entry and counts its words as read.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/NovelId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProgressRequest' }
      responses:
        '200':
          description: Updated progress
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadingProgressResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ----------------------------------------------------------- bookmarks
  /bookmarks:
    get:
      tags: [bookmarks]
      operationId: listBookmarks
      summary: List bookmarks, newest first
      security: [{ bearerAuth: [] }]
      parameters:
        - name: novel_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Bookmarks
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Bookmark' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [bookmarks]
      operationId: createBookmark
      summary: Add a bookmark
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookmarkInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Bookmark' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /bookmarks/sync:
    post:
      tags: [bookmarks]
      operationId: syncBookmarks
      summary: Apply bookmarks changed offline and return the full list
      description: |
        Upserts keep client-generated ids. Upserts on deleted chapters, or
        with ids belonging to another user, are skipped. At most 500 changes
        per request.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookmarkSync' }
      responses:
        '200':
          description: All bookmarks after the sync
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Bookmark' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /bookmarks/{bookmarkId}:
    patch:
      tags: [bookmarks]
      operationId: updateBookmark
      summary: Change a bookmark's note or position
      security: [{ bearerAuth: [] }]
      parameters:
        - name: bookmarkId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookmarkPatch' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Bookmark' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [bookmarks]
      operationId: deleteBookmark
      summary: Delete a bookmark
      security: [{ bearerAuth: [] }]
      parameters:
        - name: bookmarkId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/Empty' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # --------------------------------------------------------------- users
  /users/me:
