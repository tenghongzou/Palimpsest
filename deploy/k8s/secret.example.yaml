# Template for the Secret the backend reads. Copy it outside the repository,
# fill in real values and apply it once:
#   kubectl -n palimpsest apply -f my-secret.yaml
# Never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: palimpsest-secrets
  namespace: palimpsest
type: Opaque
stringData:
  DB_PASSWORD: change-me
  REDIS_PASSWORD: ""
  # At least 32 random characters, e.g. `openssl rand -base64 48`.
  JWT_SECRET: change-me-to-a-long-random-value
  MEILI_API_KEY: change-me
  MINIO_ACCESS_KEY: change-me
  MINIO_SECRET_KEY: change-me
  GOOGLE_TRANSLATE_API_KEY: ""
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""
